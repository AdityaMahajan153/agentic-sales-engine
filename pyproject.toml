[project]
name = "agentic-sales-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=3.3.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
]

[project.scripts]
agentic-sales-engine = "agentic_sales_engine:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
